<style>
:root{--b:#111;--g:#f2f2f2}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:#e9e9e9;color:#111}
.top{background:#000;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;z-index:5}
.top img{height:34px}.top b{flex:1;font-size:17px}
button{background:#111;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer;margin:2px}
button.s{background:#fff;color:#111;border:1px solid #999}button.d{background:#b00}
.wrap{max-width:900px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h2{background:#000;color:#fff;text-align:center;font-weight:400;font-size:18px;margin:-12px -12px 12px;padding:8px;border-radius:8px 8px 0 0}
label{font-size:12px;color:#555;display:block;margin-top:6px}
input,textarea,select{width:100%;padding:8px;font-size:15px;border:1px solid #bbb;border-radius:6px;font-family:inherit}
textarea{min-height:60px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.wx>div{border:1px solid #ddd;border-radius:6px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{position:relative;border:1px solid #ddd;border-radius:6px;overflow:hidden}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .ts{position:absolute;right:4px;top:4px;background:#0008;color:#fff;font-size:11px;padding:1px 4px}
.ph input{border:0;border-top:1px solid #ddd;border-radius:0;font-size:13px}.ph .x{position:absolute;left:2px;top:2px;padding:2px 7px}
.sub{border-left:3px solid #000;padding-left:8px;margin:10px 0}
.q{display:grid;grid-template-columns:1fr auto;gap:6px;border-bottom:1px solid #eee;padding:8px 0}.q .opts label{display:inline;margin-right:8px;font-size:14px;color:#111}
.list div{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee}
canvas#sig{border:1px dashed #888;width:100%;height:150px;touch-action:none;background:#fff;border-radius:6px}
.hide{display:none!important}.muted{color:#777;font-size:13px}
#print{display:none}
@media print{
 @page{size:letter;margin:.4in .4in .6in;@bottom-center{content:counter(page) " of " counter(pages) " | " var(--x,"");font:11px Arial}}
 body{background:#fff}.top,.wrap{display:none!important}#print{display:block}
 #print{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pH{background:#000;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:flex-start}
 .pH h1{margin:0;font-weight:400;font-size:28px}.pH img{height:44px}.pBar{background:#000;color:#fff;display:flex;justify-content:space-between;padding:6px 14px;border-top:1px solid #444}
 .pPh{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}.pPh div{position:relative}.pPh img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
 .pPh span{position:absolute;right:3px;bottom:3px;color:#fff;font-size:10px;text-shadow:0 0 3px #000}.pPh i{display:block;font-size:10px;font-style:normal}
 .pS{border:1px solid #ddd;margin:14px 8px;break-inside:auto}.pS>h3{background:#000;color:#fff;text-align:center;font-weight:400;margin:6px;padding:6px;font-size:15px}
 .pW{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.pW>div{border:1px solid #ddd;margin:4px;padding:6px}.pW .t{font-size:30px}.pW small{font-size:9px}
 .pN{padding:6px 18px}.pN p{margin:3px 0}.pN b{display:block;margin-top:10px;font-weight:400}
 table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;vertical-align:top;border-bottom:1px solid #eee}
 .sig{text-align:center;margin:30px}.sig img{height:70px}.pg{break-before:page}
}
</style></head><body>

const QS=["SOILS - Location and Elevation Staked per Construction Drawing Layout?","SOILS - Any subgrade issues? Compaction testing, is the soils meeting the compaction percentage as specified in the soils report?","CONCRETE FORMS - Structural characteristics meeting specifications in the construction set?","REINFORCEMENT STEEL - Structural characteristics meeting specifications in the construction set?","CONCRETE - Mixture and specification testing, do they meet the specifications in the construction set?","PIPE PENETRATIONS/TRANSITIONS - Quality of construction, do they meet the specifications in the construction set?"];
const TIMES=["6:00 AM","12:00 PM","4:00 PM"],HRS=[6,12,16];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let DB=JSON.parse(localStorage.getItem("hdr_db")||'{"projects":[],"reports":[]}');
const save=()=>{try{localStorage.setItem("hdr_db",JSON.stringify(DB));return true}catch(e){alert("Storage full - export a backup and delete old reports. ("+e.message+")");return false}};
let P=null,R=null;
const stamp=d=>{d=new Date(d);const p=n=>String(n).padStart(2,"0");let h=d.getHours(),ap=h<12?"AM":"PM";h=h%12||12;return `${p(d.getMonth()+1)}/${p(d.getDate())}/${String(d.getFullYear()).slice(2)} | ${p(h)}:${p(d.getMinutes())}${ap}`};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function show(v){["home","proj","rep"].forEach(x=>$(x).classList.toggle("hide",x!==v));$("ttl").textContent=v=="home"?"Daily Field Reports":v=="proj"?(P.name||"New Project"):(P.name+" – "+R.date);scrollTo(0,0)}
function home(){P=R=null;$("projList").innerHTML=DB.projects.map(p=>`<div><span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.address)} ${p.job?"· Job #"+esc(p.job):""}</span></span><button onclick="openProj('${p.id}')">Open</button></div>`).join("")||'<p class="muted">No projects yet.</p>';show("home")}
function openProj(id){P=DB.projects.find(p=>p.id==id);for(const[k,f]of[["name","pName"],["job","pJob"],["address","pAddr"],["lat","pLat"],["lon","pLon"],["by","pBy"]])$(f).value=P[k]||"";$("pSubs").value=(P.subs||[]).join(", ");
 const rs=DB.reports.filter(r=>r.pid==P.id).sort((a,b)=>b.date.localeCompare(a.date));
 $("repList").innerHTML=rs.map(r=>`<div><span>${esc(r.date)} · ${esc(r.by)}</span><button onclick="openRep('${r.id}')">Open</button></div>`).join("")||'<p class="muted">No reports yet.</p>';show("proj")}
$("newProj").onclick=()=>{P={id:uid(),name:"",subs:[]};DB.projects.push(P);openProj(P.id)};
$("saveProj").onclick=()=>{Object.assign(P,{name:pName.value,job:pJob.value,address:pAddr.value,lat:pLat.value,lon:pLon.value,by:pBy.value,subs:pSubs.value.split(",").map(s=>s.trim()).filter(Boolean)});save();openProj(P.id)};
$("delProj").onclick=()=>{if(!confirm("Delete project and all its reports?"))return;DB.projects=DB.projects.filter(p=>p!==P);DB.reports=DB.reports.filter(r=>r.pid!=P.id);save();home()};
$("homeBtn").onclick=()=>{if(R)collect(),save();home()};
const blank=()=>({id:uid(),pid:P.id,date:today(),by:P.by||"",site:[],att:[],wx:TIMES.map(()=>({t:"",c:"",w:"",p:"",h:""})),notes:"",subs:(P.subs||[]).map(n=>({name:n,items:""})),survey:QS.map(()=>({a:"",d:""})),sig:"",sigTs:""});
$("newRep").onclick=()=>{R=blank();DB.reports.push(R);save();openRep(R.id)};
$("dupRep").onclick=()=>{const l=DB.reports.filter(r=>r.pid==P.id).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!l)return alert("No report to duplicate");
 const n=JSON.parse(JSON.stringify(l));Object.assign(n,{id:uid(),date:today(),site:[],att:[],sig:"",sigTs:"",wx:blank().wx});DB.reports.push(n);save();openRep(n.id)};
function openRep(id){R=DB.reports.find(r=>r.id==id);rDate.value=R.date;rBy.value=R.by;notes.value=R.notes;renderPh();renderWx();renderSubs();renderSurvey();
 sigName.textContent=R.by||"____";sigTs.textContent=R.sigTs?stamp(R.sigTs):"";show("rep");initSig()}
function renderPh(){for(const k of["site","att"])$(k+"Ph").innerHTML=R[k].map((p,i)=>`<div class="ph"><img src="${p.src}"><span class="ts">${stamp(p.ts)}</span><button class="x d" onclick="R.${k}.splice(${i},1);renderPh()">×</button><input placeholder="Caption" value="${esc(p.cap)}" oninput="R.${k}[${i}].cap=this.value"></div>`).join("")}
function renderWx(){$("wx").innerHTML=R.wx.map((w,i)=>`<div><b>${TIMES[i]}</b><div class="row">${[["t","Temp °F"],["c","Conditions"],["w","Wind mph"],["p","Precip in"],["h","Humidity %"]].map(([k,l])=>`<div><label>${l}</label><input data-wx="${i}" data-k="${k}" value="${esc(w[k])}"></div>`).join("")}</div></div>`).join("")}
function renderSubs(){$("subs").innerHTML=R.subs.map((s,i)=>`<div class="sub"><div class="row"><div><label>Subcontractor</label><input data-sub="${i}" data-k="name" value="${esc(s.name)}"></div></div><label>Activities (one per line)</label><textarea data-sub="${i}" data-k="items">${esc(s.items)}</textarea><button class="s" onclick="collect();R.subs.splice(${i},1);renderSubs()">Remove</button></div>`).join("")}
$("addSub").onclick=()=>{collect();R.subs.push({name:"",items:""});renderSubs()};
function renderSurvey(){$("survey").innerHTML=R.survey.map((s,i)=>`<div class="q"><div>${i+1}. ${QS[i]}</div><div class="opts">${["N/A","No","Yes"].map(o=>`<label><input type="radio" style="width:auto" name="q${i}" value="${o}" ${s.a==o?"checked":""}> ${o}</label>`).join("")}</div><input data-sv="${i}" placeholder="Description" value="${esc(s.d)}" style="grid-column:1/-1"></div>`).join("")}
function collect(){if(!R)return;R.date=rDate.value;R.by=rBy.value;R.notes=notes.value;
 document.querySelectorAll("[data-wx]").forEach(e=>R.wx[e.dataset.wx][e.dataset.k]=e.value);
 document.querySelectorAll("[data-sub]").forEach(e=>R.subs[e.dataset.sub][e.dataset.k]=e.value);
 document.querySelectorAll("[data-sv]").forEach(e=>R.survey[e.dataset.sv].d=e.value);
 R.survey.forEach((s,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);s.a=c?c.value:""})}
rBy.oninput=()=>sigName.textContent=rBy.value||"____";
$("saveRep").onclick=()=>{collect();if(save())saved.textContent="Saved "+stamp(Date.now())};
$("delRep").onclick=()=>{if(!confirm("Delete this report?"))return;DB.reports=DB.reports.filter(r=>r!==R);save();R=null;openProj(P.id)};
// photos
let addTo="site";document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{addTo=b.dataset.add;fileIn.click()});
function compress(file,max=1280,q=.7){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",q))};img.src=URL.createObjectURL(file)})}
fileIn.onchange=async()=>{collect();for(const f of fileIn.files)R[addTo].push({src:await compress(f),ts:f.lastModified||Date.now(),cap:""});fileIn.value="";renderPh();save()};
// weather
$("wxAuto").onclick=async()=>{collect();wxMsg.textContent="Loading…";try{let lat=P.lat,lon=P.lon;
 if(!lat||!lon){const g=await geocode(P.address||"");if(!g)throw Error("Couldn't locate address - enter lat/long on the project");lat=g.latitude;lon=g.longitude;P.lat=lat;P.lon=lon}
 const past=R.date<today();const base=past?"https://archive-api.open-meteo.com/v1/archive":"https://api.open-meteo.com/v1/forecast";
 const j=await(await fetch(`${base}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&start_date=${R.date}&end_date=${R.date}`)).json();
 if(!j.hourly)throw Error(j.reason||"No data");const h=j.hourly;
 R.wx=HRS.map(i=>({t:Math.round(h.temperature_2m[i]),c:wcode(h.weather_code[i]),w:Math.round(h.wind_speed_10m[i]),p:h.precipitation[i],h:h.relative_humidity_2m[i]}));renderWx();save();wxMsg.textContent="Filled for "+R.date}catch(e){wxMsg.textContent="Weather failed: "+e.message}};
async function geocode(a){const zip=(a.match(/\b\d{5}\b(?!.*\b\d{5}\b)/)||[])[0];const st=(a.match(/\b([A-Z]{2})\b\s*\d{0,5}\s*$/)||[])[1];
 const words=a.replace(/\b\d+\w*\b/g," ").split(/[ ,]+/).filter(w=>w.length>2&&!/^(ave|st|rd|road|street|avenue|hwy|blvd|dr|ln)$/i.test(w)).reverse();
 for(const q of [zip,...words].filter(Boolean)){const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=10&country=US&name="+encodeURIComponent(q))).json();
  const r=(j.results||[]);const m=r.find(x=>!st||(x.admin1_code||x.admin1||"").toUpperCase().startsWith(st)||x.admin1&&x.admin1.slice(0,2).toUpperCase()==st)||(q==zip&&r[0]);if(m)return m}return null}
function wcode(c){return c==0?"Clear":c<=2?"Partially cloudy":c==3?"Overcast":c<50?"Fog":c<60?"Drizzle":c<70?"Rain":c<80?"Snow":c<90?"Showers":"Thunderstorm"}
function icon(c){c=(c||"").toLowerCase();return c.includes("clear")?"☀️":c.includes("part")?"⛅":c.includes("rain")||c.includes("shower")||c.includes("drizzle")?"🌧️":c.includes("snow")?"❄️":c.includes("thunder")?"⛈️":c?"☁️":""}
// signature
let sigInit=false;function initSig(){const c=sig,x=c.getContext("2d");c.width=c.offsetWidth*2;c.height=300;x.lineWidth=4;x.lineCap="round";
 if(R.sig){const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=R.sig}
 if(sigInit)return;sigInit=true;let dr=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dr=true;const[a,b]=pt(e);c.getContext("2d").beginPath();c.getContext("2d").moveTo(a,b)};
 c.onpointermove=e=>{if(!dr)return;const[a,b]=pt(e),x=c.getContext("2d");x.lineTo(a,b);x.stroke()};
 c.onpointerup=c.onpointerleave=()=>{if(dr){dr=false;R.sig=c.toDataURL()}}}
sigClr.onclick=()=>{sig.getContext("2d").clearRect(0,0,sig.width,sig.height);R.sig="";R.sigTs=""};
signBtn.onclick=()=>{collect();if(!R.sig)return alert("Please draw your signature first");R.sigTs=Date.now();sigTs.textContent=stamp(R.sigTs);save()};
// print
const lines=t=>(t||"").split("\n").map(s=>s.trim()).filter(Boolean);
const dateLong=d=>{const x=new Date(d+"T12:00");return x.toLocaleDateString("en-US",{weekday:"short"})+" "+x.toLocaleDateString("en-US")};
function buildPrint(){collect();const ph=a=>a.length?`<div class="pPh">${a.map(p=>`<div><img src="${p.src}"><span>${stamp(p.ts)}</span>${p.cap?`<i>${esc(p.cap)}</i>`:""}</div>`).join("")}</div>`:"";
 const nl=lines(R.notes);
 $("print").innerHTML=`<div class="pH"><div><h1>${esc(P.name)}</h1><div>${esc(P.address)}</div></div><div style="text-align:right"><img src="${LOGO}"><div>Hartman Engineering</div></div></div>
 <div class="pBar"><span><b>Date</b> ${dateLong(R.date)}</span><span><b>Job #</b> ${esc(P.job)}</span><span><b>Prepared By</b> ${esc(R.by)}</span></div>${ph(R.site)}
 <div class="pS"><h3>Weather</h3><div class="pW">${R.wx.map((w,i)=>`<div><b>${TIMES[i]}</b><div class="t">${w.t!==""?esc(w.t)+"°":"–"} ${icon(w.c)}</div><b>${esc(w.c)}</b><br><small>Wind: ${esc(w.w)} MPH | Precipitation: ${esc(w.p)}'' | Humidity: ${esc(w.h)}%</small></div>`).join("")}</div></div>
 <div class="pS"><h3>General Notes</h3><div class="pN">${nl.length?`<p><b style="display:inline;margin:0;font-weight:700">1.</b> ${esc(nl[0])}</p>`+nl.slice(1).map(l=>`<p>* ${esc(l.replace(/^[*•-]\s*/,""))}</p>`).join(""):""}
 ${R.subs.filter(s=>s.name||s.items).map(s=>`<b>${esc(s.name)}</b>${lines(s.items).map(l=>`<p>* ${esc(l.replace(/^[*•-]\s*/,""))}</p>`).join("")}`).join("")}
 <p style="margin-top:8px">${esc(R.by)}${R.sigTs?" | "+stamp(R.sigTs):""}</p></div></div>
 <div class="pS"><h3>Survey</h3><table><tr><th>Questions</th><th>N/A</th><th>No</th><th>Yes</th><th>Description</th></tr>${R.survey.map((s,i)=>`<tr><td>${i+1}. ${QS[i]}</td>${["N/A","No","Yes"].map(o=>`<td>${s.a==o?"✔":""}</td>`).join("")}<td>${esc(s.d)}</td></tr>`).join("")}</table></div>
 ${R.att.length?`<div class="pS"><h3>Attachments</h3>${ph(R.att)}</div>`:""}
 <div class="sig">${R.sig?`<img src="${R.sig}"><br>`:""}I, ${esc(R.by)}, have reviewed and completed this report.<br>${esc(R.by)}${R.sigTs?" | "+stamp(R.sigTs):""}</div>`;
 document.documentElement.style.setProperty("--x",JSON.stringify(P.name||""));document.title=`${P.name} Daily Report ${R.date}`}
printBtn.onclick=()=>{buildPrint();save();setTimeout(()=>print(),300)};
// backup
expBtn.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="hartman-reports-backup-"+today()+".json";a.click()};
imp.onchange=async()=>{try{const d=JSON.parse(await imp.files[0].text());if(!d.projects)throw 0;if(!confirm("Merge backup into this device's data?"))return;
 for(const k of["projects","reports"])for(const x of d[k]){const i=DB[k].findIndex(y=>y.id==x.id);i>=0?DB[k][i]=x:DB[k].push(x)}save();home()}catch(e){alert("Invalid backup file")}imp.value=""};
home();
</script></body></html>
